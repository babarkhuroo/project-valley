# Render Blueprint: the game server (dist/ + API + live WebSockets) and its Postgres.
# Render → New → Blueprint → pick this repo. See README "Deploying".
services:
  - type: web
    name: project-valley
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run serve
    healthCheckPath: /api/time
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_CONFIG_NATIVE_IGNORE_WARNING
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: project-valley-db
          property: connectionString

databases:
  - name: project-valley-db
    plan: free
    databaseName: project_valley
